name: Release Postacı

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Otomatik Sürüm Yükseltme (Opsiyonel)'
        required: false
        default: 'none'
        type: choice
        options:
          - 'none'
          - 'patch'
          - 'minor'
          - 'major'
      draft:
        description: 'Taslak (Draft) olarak oluştur'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Ön sürüm (Pre-release) olarak işaretle'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Publish Windows Executables
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🔧 Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🔖 Bump version and tag (Workflow Dispatch)
        id: version_bump
        if: github.event_name == 'workflow_dispatch' && inputs.version_bump != 'none'
        run: |
          npm version ${{ inputs.version_bump }} -m "chore(release): v%s"
          git push
          git push --tags

      - name: 🔍 Resolve Version & Tag
        id: meta
        shell: pwsh
        run: |
          $pkg = Get-Content -Raw -Path ./package.json | ConvertFrom-Json
          $version = $pkg.version
          $tag = if ($env:GITHUB_REF -like "refs/tags/v*") {
            $env:GITHUB_REF.Substring(10)
          } else {
            "v$version"
          }
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved version: $version (Tag: $tag)"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🛠️ Build Frontend (Vite + TypeScript)
        run: npm run build

      - name: 🚀 Package & Build Windows Binaries (NSIS + Portable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --win --x64

      - name: 🔐 Compute SHA-256 Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release/*.exe
          $checksumLines = foreach ($f in $files) {
            $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $checksumLines | Out-File -FilePath release/checksums.txt -Encoding utf8
          Get-Content release/checksums.txt

      - name: 📢 Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Postacı ${{ steps.meta.outputs.tag }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/latest.yml
            release/checksums.txt
          body: |
            ## 📮 Postacı ${{ steps.meta.outputs.tag }}
            
            Windows için modern, yerel SQLite önbellekli ve güvenli masaüstü e-posta istemcisi.

            ### 📦 İndirme Seçenekleri (Downloads)
            - **Kurulum Dosyası (NSIS Installer):** `Postacı Setup ${{ steps.meta.outputs.version }}.exe`
              - Masaüstü ve Başlat menüsü kısayollarını otomatik oluşturur.
              - Uygulama simgesini Windows kabuğuna entegre eder.
            - **Taşınabilir Sürüm (Portable):** `Postacı-${{ steps.meta.outputs.version }}-portable.exe`
              - Kurulum gerektirmez, doğrudan çalıştırılabilir.
            - **Bütünlük Doğrulama:** `checksums.txt` (SHA-256)

            ---
            *Bu sürüm GitHub Actions tarafından otomatik olarak derlenmiş ve yayınlanmıştır.*
