name: Release Postacı

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Otomatik Sürüm Yükseltme (Opsiyonel)'
        required: false
        default: 'none'
        type: choice
        options:
          - 'none'
          - 'patch'
          - 'minor'
          - 'major'
      draft:
        description: 'Taslak (Draft) olarak oluştur'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Ön sürüm (Pre-release) olarak işaretle'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build & Publish Windows Executables
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: 🔧 Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🔖 Bump version and tag (Workflow Dispatch)
        id: version_bump
        if: github.event_name == 'workflow_dispatch' && inputs.version_bump != 'none'
        run: |
          npm version ${{ inputs.version_bump }} -m "chore(release): v%s"
          git push
          git push --tags

      - name: 🔍 Resolve Version & Tag
        id: meta
        shell: pwsh
        run: |
          $pkg = Get-Content -Raw -Path ./package.json | ConvertFrom-Json
          $version = $pkg.version
          $tag = if ($env:GITHUB_REF -like "refs/tags/v*") {
            $env:GITHUB_REF.Substring(10)
          } else {
            "v$version"
          }
          Write-Output "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved version: $version (Tag: $tag)"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Code Quality & Linter Check
        run: npm run lint

      - name: 🛠️ Build Frontend (Vite + TypeScript)
        run: npm run build

      - name: 🚀 Package & Build Windows Binaries (NSIS + Portable)
        run: |
          npx electron-builder --win --x64 --publish never

      - name: 🔐 Compute SHA-256 Checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release/*.exe
          $checksumLines = foreach ($f in $files) {
            $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $checksumLines | Out-File -FilePath release/checksums.txt -Encoding utf8
          Get-Content release/checksums.txt

      - name: 📢 Publish GitHub Release (gh CLI + retry)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $version = "${{ steps.meta.outputs.version }}"
          $notes = @"
          ## 📮 Postacı $tag

          Windows için modern, yerel SQLite önbellekli ve güvenli masaüstü e-posta istemcisi.

          ### 📦 İndirme Seçenekleri (Downloads)
          - **Kurulum Dosyası (NSIS Installer):** ``Postaci-Setup-$version.exe``
            - Masaüstü ve Başlat menüsü kısayollarını otomatik oluşturur.
            - Uygulama simgesini Windows kabuğuna entegre eder.
          - **Taşınabilir Sürüm (Portable):** ``Postaci-Portable-$version.exe``
            - Kurulum gerektirmez, doğrudan çalıştırılabilir.
          - **Bütünlük Doğrulama:** ``checksums.txt`` (SHA-256)

          ---
          *Bu sürüm GitHub Actions tarafından otomatik olarak derlenmiş ve yayınlanmıştır.*
          "@

          function Upload-WithRetry([string]$file, [string]$tag) {
            for ($i = 1; $i -le 5; $i++) {
              Write-Host "⬆️ Yükleniyor ($i/5): $file"
              gh release upload $tag $file --clobber 2>&1 | Out-Host
              if ($LASTEXITCODE -eq 0) {
                Write-Host "✅ Yüklendi: $file"
                return $true
              }
              Write-Host "⚠️ Yükleme başarısız ($i/5): $file — 30 sn bekleniyor..."
              Start-Sleep -Seconds 30
            }
            return $false
          }

          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "👩‍🏭 $tag için yeni release oluşturuluyor..."
            $extra = @()
            if ('${{ inputs.draft }}' -eq 'true') { $extra += '--draft' }
            if ('${{ inputs.prerelease }}' -eq 'true') { $extra += '--prerelease' }
            gh release create $tag --title "Postacı $tag" --notes $notes @extra
          } else {
            Write-Host "♻️ $tag release'i zaten var, asset'ler --clobber ile yenilenecek."
            gh release edit $tag --title "Postacı $tag" --notes $notes
          }

          $failed = @()
          $files = @()
          $files += (Get-ChildItem -Path release/*.exe).FullName
          $files += (Join-Path $PWD 'release/latest.yml')
          $files += (Join-Path $PWD 'release/checksums.txt')
          foreach ($f in $files) {
            if (-not (Upload-WithRetry $f $tag)) { $failed += $f }
          }
          if ($failed.Count -gt 0) {
            Write-Error "❌ Bu dosyalar 5 denemede yüklenemedi: $($failed -join ', ')"
            exit 1
          }
          Write-Host "🎉 Tüm asset'ler yayınlandı."
