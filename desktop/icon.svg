<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Ultra Radiant Clean White / Silver-Blue Gradient -->
    <linearGradient id="brightBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Electric Cyan & Azure Border Glow -->
    <linearGradient id="neonBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Vibrant Electric Blue Envelope Flap -->
    <linearGradient id="vibrantFlap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Bright Blue Body -->
    <linearGradient id="vibrantBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Speed Aerodynamic Wings -->
    <linearGradient id="speedWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- Golden Postacı Star Seal -->
    <linearGradient id="goldStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <filter id="softCardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#64748B" flood-opacity="0.25"/>
    </filter>

    <filter id="envelopeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1E3A8A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Radiant Pure Snow-White Rounded Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="116" fill="url(#brightBgGrad)" stroke="url(#neonBorderGrad)" stroke-width="8" filter="url(#softCardShadow)"/>

  <!-- Dynamic Flying Letter Streamers (Light Mode Aesthetics) -->
  <path d="M 90 280 C 120 170, 200 120, 420 120 C 320 180, 250 250, 220 350 Z" fill="url(#speedWing)" opacity="0.9"/>
  <path d="M 60 320 C 90 230, 170 170, 390 150 C 280 210, 220 290, 180 380 Z" fill="url(#speedWing)" opacity="0.35"/>

  <!-- Origami Letter Envelope -->
  <g filter="url(#envelopeShadow)">
    <!-- Base Envelope -->
    <rect x="110" y="170" width="292" height="204" rx="26" fill="url(#vibrantBody)" stroke="#FFFFFF" stroke-width="4"/>

    <!-- Side Fold Shadows -->
    <path d="M 110 348 L 226 268 L 110 186 Z" fill="#1D4ED8" opacity="0.9"/>
    <path d="M 402 348 L 286 268 L 402 186 Z" fill="#1D4ED8" opacity="0.9"/>

    <!-- Bottom Envelope Triangle -->
    <path d="M 110 374 L 256 262 L 402 374 Z" fill="#1E40AF" stroke="#FFFFFF" stroke-width="3"/>

    <!-- Top Aerodynamic Fold Flap -->
    <path d="M 110 180 C 110 180, 226 296, 256 296 C 286 296, 402 180, 402 180 L 402 170 C 402 154, 388 144, 372 144 L 140 144 C 124 144, 110 154, 110 170 Z" 
          fill="url(#vibrantFlap)" 
          stroke="#FFFFFF" 
          stroke-width="3.5"/>

    <!-- Golden Postacı Emblem -->
    <circle cx="256" cy="296" r="26" fill="url(#goldStar)" stroke="#FFFFFF" stroke-width="3.5"/>
    <path d="M 256 278 L 268 294 L 256 312 L 244 294 Z" fill="#FFFFFF"/>
  </g>
</svg>
