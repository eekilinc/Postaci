<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Crisp Luminous Light Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>

    <!-- Sleek Subtle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <!-- Vibrant Top Flap Gradient -->
    <linearGradient id="flapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Dynamic Envelope Body Gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>

    <!-- Vibrant Speed Wing Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Gold Accent Seal Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter for Depth -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.16"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.12"/>
    </filter>

    <filter id="iconShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a8a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Luminous White / Sky Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="6" filter="url(#cardShadow)"/>

  <!-- Dynamic Glowing Speed Wings (Paper Airplane / Postal Bird Curves) -->
  <path d="M 100 290 C 120 180, 200 130, 400 130 C 310 180, 250 240, 230 340 Z" fill="url(#wingGrad)" opacity="0.85"/>
  <path d="M 70 330 C 100 240, 180 180, 370 160 C 270 220, 210 290, 180 370 Z" fill="url(#wingGrad)" opacity="0.35"/>

  <!-- Origami 3D Mail Envelope -->
  <g filter="url(#iconShadow)">
    <!-- Envelope Main Base -->
    <rect x="112" y="170" width="288" height="204" rx="28" fill="url(#bodyGrad)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="3"/>

    <!-- Left / Right Side Folds -->
    <path d="M 112 344 L 228 266 L 112 186 Z" fill="#1e3a8a" opacity="0.85"/>
    <path d="M 400 344 L 284 266 L 400 186 Z" fill="#1e3a8a" opacity="0.85"/>

    <!-- Bottom Center Fold -->
    <path d="M 112 374 L 256 260 L 400 374 Z" fill="#172554" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2"/>

    <!-- Top Flap (Luminous Gradient Active Fold) -->
    <path d="M 112 180 C 112 180, 228 296, 256 296 C 284 296, 400 180, 400 180 L 400 172 C 400 156, 386 146, 370 146 L 142 146 C 126 146, 112 156, 112 172 Z" 
          fill="url(#flapGrad)" 
          stroke="rgba(255, 255, 255, 0.6)" 
          stroke-width="3"/>

    <!-- Golden Postacı Seal / Lightning Emblem -->
    <circle cx="256" cy="296" r="24" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3" filter="url(#cardShadow)"/>
    <path d="M 256 280 L 266 294 L 256 308 L 246 294 Z" fill="#ffffff"/>
  </g>
</svg>
